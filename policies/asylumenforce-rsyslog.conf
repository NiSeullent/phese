# Install as /etc/rsyslog.d/10-asylumenforce.conf after rsyslogd -N1 validation.
# This route must precede generic authpriv rules if duplicate logging is unwanted.
template(name="AsylumEnforceJSONLine" type="string" string="%msg%\n")

if ($programname == "phese") then {
    action(
        type="omfile"
        file="/var/log/asylumenforce/admissions.jsonl"
        template="AsylumEnforceJSONLine"
        createDirs="on"
        dirOwner="root"
        dirGroup="root"
        dirCreateMode="0750"
        fileOwner="root"
        fileGroup="root"
        fileCreateMode="0640"
    )
    # Remove this stop only if intentional duplicate retention is required.
    stop
}
