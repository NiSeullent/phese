# Additive systemd drop-in for a tested PHP-FPM/Apache service.
# Review existing service capabilities and application paths before applying.
[Service]
NoNewPrivileges=yes
ProtectSystem=full
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
PrivateDevices=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
SystemCallFilter=~@mount @reboot @swap @module @raw-io @debug @obsolete @cpu-emulation
SystemCallErrorNumber=EPERM
